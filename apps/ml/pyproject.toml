[project]
name = "prooftamil-ml"
version = "0.1.0"
description = "ProofTamil ML service — deterministic Tamil morphology, parsing and embeddings (cascade Tier 1)."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    # multipart file uploads for the OCR route (POST /api/ocr/extract-words).
    "python-multipart>=0.0.9",
    # Handwritten-Tamil OCR pipeline (app/ocr): image cleanup + Gemini vision.
    # opencv-python-headless needs libglib at runtime — see infra/docker/ml.Dockerfile.
    "opencv-python-headless>=4.8",
    "numpy>=1.24",
    "Pillow>=10.0",
    "google-generativeai>=0.8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
    "ruff>=0.7",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# FastAPI's File()/Form()/Depends() in argument defaults is the framework's required
# idiom — B008 (no function calls in defaults) is a false positive for route handlers.
"app/ocr/router.py" = ["B008"]
