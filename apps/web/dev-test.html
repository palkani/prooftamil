<!doctype html>
<html lang="ta">
<head>
<meta charset="utf-8">
<title>ProofTamil — dev test harness</title>
<!--
  A THROWAWAY test harness, not the product.

  The real editor is Phase 4 (Next.js + TipTap, decoration-based inline underlines).
  This exists so the cascade can be driven by hand before that lands: type Tamil,
  see which tier caught what, and how long it took.

  Served by `make demo`, which also starts the api and ml services.
-->
<style>
  :root { --bg:#faf9f7; --fg:#1a1a1a; --muted:#6b6b6b; --line:#e3e0da; --accent:#0b6e4f; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#16181c; --fg:#e8e6e3; --muted:#9a9a9a; --line:#2c2f36; --accent:#4ade80; }
  }
  * { box-sizing: border-box; }
  body { margin:0; padding:2rem 1.25rem; background:var(--bg); color:var(--fg);
         font-family: system-ui, -apple-system, "Segoe UI", sans-serif; line-height:1.5; }
  main { max-width: 760px; margin: 0 auto; }
  h1 { font-size:1.35rem; margin:0 0 .25rem; }
  .sub { color:var(--muted); font-size:.9rem; margin:0 0 1.5rem; }
  textarea { width:100%; min-height:150px; padding:1rem; font-size:1.15rem; line-height:1.7;
             background:transparent; color:var(--fg); border:1px solid var(--line);
             border-radius:10px; resize:vertical; font-family: inherit; }
  textarea:focus { outline:2px solid var(--accent); outline-offset:-1px; }
  .row { display:flex; gap:.6rem; align-items:center; margin:.9rem 0; flex-wrap:wrap; }
  button { padding:.55rem 1.1rem; font-size:.92rem; font-weight:600; cursor:pointer;
           background:var(--accent); color:#fff; border:0; border-radius:8px; }
  button.ghost { background:transparent; color:var(--fg); border:1px solid var(--line); }
  button:disabled { opacity:.5; cursor:default; }
  .status { color:var(--muted); font-size:.85rem; }
  .card { border:1px solid var(--line); border-radius:10px; padding:.85rem 1rem; margin:.6rem 0;
          display:flex; gap:1rem; align-items:baseline; flex-wrap:wrap; }
  .fix { font-size:1.1rem; }
  del { color:#c0392b; text-decoration-thickness:1px; }
  ins { color:var(--accent); text-decoration:none; font-weight:600; }
  .tag { font-size:.72rem; text-transform:uppercase; letter-spacing:.04em; padding:.15rem .5rem;
         border-radius:999px; border:1px solid var(--line); color:var(--muted); }
  .t1 { border-color:var(--accent); color:var(--accent); }
  .why { color:var(--muted); font-size:.88rem; width:100%; margin-top:.1rem; }
  .empty { color:var(--muted); padding:1rem 0; }
  .samples button { background:transparent; color:var(--muted); border:1px solid var(--line);
                    font-weight:400; font-size:.82rem; padding:.35rem .7rem; }
  code { background:rgba(128,128,128,.12); padding:.1rem .35rem; border-radius:4px; font-size:.85em; }
</style>
</head>
<body>
<main>
  <h1>ProofTamil — cascade test harness</h1>
  <p class="sub">
    Not the product. A hand-driver for the Tier 0–4 cascade, until the Phase 4 editor exists.
    <span class="tag t1">tier 1</span> = deterministic rules (free, ~1ms).
    <span class="tag">tier 3/4</span> = Gemini (costs money, ~1s).
  </p>

  <textarea id="text" spellcheck="false" lang="ta">அந்த பையன் வந்தான். அவர்கள் வனிகர்கள். நாங்கள் நகரத்திற்கு போனேன்.</textarea>

  <div class="row samples">
    <button data-s="அந்த பையன் வந்தான்.">sandhi</button>
    <button data-s="அவர்கள் வனிகர்கள்.">spelling</button>
    <button data-s="நாங்கள் நகரத்திற்கு போனேன்.">agreement (tier 1 is blind to this)</button>
    <button data-s="அது ஒரு புலி.">real-word trap — must stay silent</button>
    <button data-s="நான் பள்ளிக்கு சென்றேன்.">clean — must stay silent</button>
  </div>

  <div class="row">
    <button id="go">Proofread</button>
    <button id="stream" class="ghost">Stream (SSE)</button>
    <span class="status" id="status"></span>
  </div>

  <div id="out"></div>
</main>

<script>
const API = "http://localhost:8080";
const $ = (id) => document.getElementById(id);
const esc = (s) => s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

document.querySelectorAll(".samples button").forEach(b =>
  b.onclick = () => { $("text").value = b.dataset.s; $("out").innerHTML = ""; $("status").textContent = ""; });

function render(suggestions, text) {
  if (!suggestions.length) {
    return `<p class="empty">No suggestions — the cascade considers this correct.
            (For the புலி and clean samples, that is the <em>right</em> answer.)</p>`;
  }
  return suggestions.map(s => {
    // Prove the offsets land on the right characters — this is the bug class that
    // silently dropped corrections before offsets were derived server-side.
    const span = [...text].slice(s.start, s.end).join("");
    const ok = span === s.original;
    const tier = s.source_tier === 1
      ? '<span class="tag t1">tier 1 · rules · free</span>'
      : `<span class="tag">tier ${s.source_tier} · model</span>`;
    return `<div class="card">
      <span class="fix"><del>${esc(s.original)}</del> → <ins>${esc(s.suggestion)}</ins></span>
      ${tier}
      <span class="tag">${esc(s.type)}</span>
      <span class="tag">conf ${s.confidence}</span>
      ${ok ? "" : '<span class="tag" style="border-color:#c0392b;color:#c0392b">BAD OFFSET</span>'}
      ${s.explanation ? `<div class="why">${esc(s.explanation)}</div>` : ""}
    </div>`;
  }).join("");
}

$("go").onclick = async () => {
  const text = $("text").value;
  $("status").textContent = "calling cascade…";
  $("out").innerHTML = "";
  const t0 = performance.now();
  try {
    const r = await fetch(`${API}/api/v1/proofread`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ text }),
    });
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    const d = await r.json();
    const wall = Math.round(performance.now() - t0);
    $("status").textContent =
      `${d.suggestions.length} suggestion(s) · server ${d.latency_ms}ms · round-trip ${wall}ms`
      + (d.cache_hit ? " · CACHE HIT" : "")
      + (d.model_pending ? " · model tier unavailable" : "");
    $("out").innerHTML = render(d.suggestions, text);
  } catch (e) {
    $("status").textContent = `failed: ${e.message} — is the API up on :8080?`;
  }
};

// The streaming path: Tier 1 lands in milliseconds, the model residue follows.
$("stream").onclick = () => {
  const text = $("text").value;
  $("out").innerHTML = "";
  $("status").textContent = "streaming…";
  const t0 = performance.now();
  const es = new EventSource(`${API}/api/v1/proofread/stream?text=${encodeURIComponent(text)}`);
  let n = 0;
  es.onmessage = (ev) => {
    const d = JSON.parse(ev.data);
    if (d.type === "done") {
      $("status").textContent = `stream complete · ${n} suggestion(s) · ${Math.round(performance.now() - t0)}ms`;
      es.close();
      return;
    }
    n += (d.suggestions || []).length;
    $("out").insertAdjacentHTML("beforeend", render(d.suggestions || [], text));
    $("status").textContent = `+${Math.round(performance.now() - t0)}ms — seq ${d.seq}`;
  };
  es.onerror = () => { $("status").textContent = "stream error — is the API up on :8080?"; es.close(); };
};
</script>
</body>
</html>
