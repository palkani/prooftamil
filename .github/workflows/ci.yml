name: ci

on:
  pull_request:
  push:
    branches: [main]

# A new push to a PR makes the in-flight run obsolete; cancel it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # gitleaks scans history, not just the tip
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  go:
    name: api (go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: apps/api/go.sum
      - run: go mod download
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"; echo "$unformatted"; exit 1
          fi
      - run: go vet ./...
      - run: go build ./...
      - run: go test -race ./...

  python:
    name: ml (python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/ml
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest -q

  eval:
    name: accuracy eval (§11)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e "./apps/ml[dev]"
      # Gates on precision and the clean-sentence false-positive rate. A change
      # that makes Tier 1 chattier fails the build: showing a writer a confident
      # wrong "correction" of their good Tamil costs more trust than a miss.
      - run: python eval/run.py

  env-manifest:
    name: env manifest (§3)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pyyaml
      # The .env.example files are generated. If someone edits the manifest and
      # forgets to regenerate, this catches the drift.
      - name: .env.example is in sync with the manifest
        run: |
          python scripts/envctl.py gen-example
          if ! git diff --exit-code -- 'apps/*/.env.example'; then
            echo "::error::.env.example is stale. Run 'make env-example' and commit."
            exit 1
          fi

  docker:
    name: images build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [api, ml]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/${{ matrix.service }}.Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
